name: Deploy Tefsen Web to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'index.html'
      - '404.html'
      - 'CNAME'
      - 'assets/**'
      - 'css/**'
      - 'js/**'
      - 'app/**'
      - 'services/**'
      - 'privacy.html'
      - 'privacy-policy/**'
      - 'terms.html'
      - 'delete-account.html'
      - 'delete-account/**'
      - 'founder.html'
      - 'robots.txt'
      - 'sitemap.xml'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: tefsen-github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout main
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare public site artifact
        run: |
          mkdir -p _site
          rsync -a             --exclude='.git/'             --exclude='.github/'             --exclude='_site/'             --exclude='docs/'             --exclude='firebase-tests/'             --exclude='tefsen-web-signup-like-fix/'             ./ _site/
          touch _site/.nojekyll
          test -f _site/index.html
          test -f _site/CNAME
          grep -q 'journey-preview' _site/index.html
          grep -q 'css/home-v2.css' _site/index.html

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
