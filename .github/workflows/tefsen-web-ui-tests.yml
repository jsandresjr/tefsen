name: Tefsen Web PR checks

on:
  pull_request:
    paths:
      - 'app/**'
      - '.github/workflows/tefsen-web-ui-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  text-first-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run dependency-free web unit tests
        run: node --test app/tests/*.test.mjs
      - name: Check JavaScript syntax
        run: |
          node --check app/js/app.js
          node --check app/js/services/data-service.js
          node --check app/js/services/auth-service.js
          node --check app/js/services/profile-photo-callable.js
          node --check app/js/services/text-first-workflow.mjs
          node --check app/js/services/profile-photo-policy.mjs
